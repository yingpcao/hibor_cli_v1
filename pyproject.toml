[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "hibor-cli"
dynamic = ["version"]
description = "给 agent 用的慧博投研资讯研报检索/抓取 CLI（个股、行业 -> Markdown -> WeKnora）"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.50",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "markdownify>=1.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
hibor = "hibor_cli.cli:main"

[tool.hatch.version]
path = "hibor_cli/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["hibor_cli"]
