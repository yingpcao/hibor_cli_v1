name: tests

# 这套测试不联网、不开浏览器（session_factory 全部注入 fake），所以 CI 里不需要慧博登录态，
# 也不该碰 state/ 与 output/ —— 那两个目录本来就在 .gitignore 里，CI 拿到的是空工作区。
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        run: uv pip install --system -r requirements-dev.txt
      - name: Run the suite
        env:
          PYTHONIOENCODING: utf-8
        shell: bash
        run: |
          set +e
          python -m pytest -q -rf --cov=hibor_cli --cov-report=term-missing 2>&1 | tee pytest.log
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" -ne 0 ]; then
            # 把失败条目提成 annotation：公开仓库不登录也能从 check run 读到，不必下载需要凭据的日志
            grep -E '^(FAILED|ERROR)' pytest.log | head -20 | while IFS= read -r line; do
              printf '::error::%s\n' "$line"
            done
            { echo '### pytest 末尾输出'; echo; echo '```'; tail -40 pytest.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$code"
