# 复制成 config.yaml 再改（config.yaml 含真实密钥，已在 .gitignore 里，不要提交）。
# 不想用仓库内配置也可以直接 `hibor init`，它写到 ~/.hibor/config.yaml。
# 这里的相对路径都以本文件所在目录为基准。

output_dir: output
state_dir: state

# 登录态 = 这个 Chrome 配置目录（profile 就是 session，不要把 cookie 导出给别的客户端）。
# 同一时刻只允许一个进程用它，并发的第二个退出码 6。也可用环境变量 HIBOR_PROFILE_DIR 覆盖。
profile_dir: state/chrome-profile

headless: false              # 建议保持 false：真实窗口更不容易被风控

# 抓取节奏。这是照着人工浏览的节奏定的，请勿调低 —— 站点在 safedog 后面，
# 被判定为机器就会用「HTTP 200 + 空白页」回你（退出码 4）。
delay:
  detail: [3, 8]             # 详情页间隔（秒，随机）
  page: [2, 4]               # 列表翻页间隔
  batch_size: 25             # 每 N 篇长休息一次
  batch_pause: [20, 40]
max_consecutive_failures: 3  # 连续失败这么多篇就判定被风控，中止（退出码 4）

# WeKnora 知识库（`hibor push --kb ...` 的目标）。密钥请走环境变量 WEKNORA_API_KEY / WEKNORA_BASE_URL。
weknora:
  base_url: ""
  api_key: ""
